<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">ShopLedger application architecture and order flow</title>
<desc id="desc">Architecture map of ShopLedger, its browser, Express server, routers, libraries, configuration, JSON data store, and numbered order placement flow.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker>
  <marker id="flowArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
    .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#475569}
    .head{font-size:15px;font-weight:700}.node{font-size:13px;font-weight:600}.small{font-size:12px}
    .group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.4}.box{fill:#fff;stroke:#94a3b8;stroke-width:1.3}
    .ui{fill:#ecfeff;stroke:#0891b2;stroke-width:1.5}.server{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}
    .ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:2}.data{fill:#fefce8;stroke:#ca8a04;stroke-width:1.5}
    .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
    .flow{fill:none;stroke:#2563eb;stroke-width:2.3;marker-end:url(#flowArrow)}
    .flowlabel{font-size:12px;font-weight:700;fill:#1d4ed8}
  </style>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="32" y="40" class="title">ShopLedger · Application Architecture</text>
<text x="32" y="63" class="subtitle">Express POS, inventory, Khata credit ledger and GST invoice · component names verified against repository files</text>

<!-- Main runtime components -->
<rect x="30" y="88" width="1140" height="288" rx="12" class="group"/>
<text x="48" y="113" class="head">Runtime and order placement flow</text>
<rect x="50" y="145" width="170" height="100" rx="9" class="ui"/>
<text x="66" y="170" class="node">Browser UI</text><text x="66" y="192" class="small">public/</text><text x="66" y="213" class="small">index.html · js/app.js · css/</text>
<rect x="278" y="145" width="170" height="100" rx="9" class="server"/>
<text x="294" y="170" class="node">server.js</text><text x="294" y="192" class="small">Express app + static UI</text><text x="294" y="213" class="small">mounts all route modules</text>
<rect x="505" y="135" width="260" height="120" rx="9" class="server"/>
<text x="522" y="160" class="node">routes/orders.js</text><text x="522" y="183" class="small">POST /api/orders</text><text x="522" y="204" class="small">validate item IDs, quantities, stock</text><text x="522" y="225" class="small">coordinate checkout and persistence</text>
<rect x="830" y="132" width="300" height="130" rx="9" class="group"/>
<text x="847" y="157" class="node">Checkout libraries</text><text x="847" y="181" class="small">lib/pricing.js → lib/tax.js</text><text x="847" y="202" class="small">lib/coupons.js · lib/inventory.js</text><text x="847" y="223" class="small">lib/ledger.js (Khata orders)</text><text x="847" y="244" class="small">lib/orders.js creates order record</text>
<rect x="505" y="290" width="260" height="62" rx="9" class="data"/>
<text x="522" y="315" class="node">lib/store.js</text><text x="522" y="337" class="small">read() / write() JSON database</text>
<rect x="830" y="290" width="300" height="62" rx="9" class="data"/>
<text x="847" y="315" class="node">data/db.json</text><text x="847" y="337" class="small">products · orders · customers · settlements · auditLog</text>
<path d="M220 195 H278" class="flow"/><text x="228" y="184" class="flowlabel">1 · POST</text>
<path d="M448 195 H505" class="flow"/><text x="452" y="184" class="flowlabel">2 · dispatch</text>
<path d="M765 195 H830" class="flow"/><text x="772" y="184" class="flowlabel">3 · calculate/check</text>
<path d="M965 262 V276 H635 V290" class="flow"/><text x="770" y="281" class="flowlabel">4 · save order + stock + ledger + audit</text>
<path d="M765 321 H830" class="flow"/><text x="776" y="312" class="flowlabel">5 · write</text>
<path d="M448 230 C480 260 482 310 505 321" class="line"/>

<!-- Other routes -->
<rect x="30" y="394" width="336" height="202" rx="12" class="group"/>
<text x="48" y="420" class="head">Other route modules · routes/</text>
<rect x="48" y="438" width="140" height="54" rx="7" class="box"/><text x="61" y="461" class="node">products.js</text><text x="61" y="480" class="small">products, coupons</text>
<rect x="204" y="438" width="144" height="54" rx="7" class="box"/><text x="217" y="461" class="node">customers.js</text><text x="217" y="480" class="small">Khata settlements</text>
<rect x="48" y="510" width="300" height="62" rx="7" class="box"/><text x="61" y="534" class="node">reports.js</text><text x="61" y="554" class="small">dashboard · GST reconciliation · pricing preview · export</text>

<!-- Libraries -->
<rect x="390" y="394" width="520" height="348" rx="12" class="group"/>
<text x="408" y="420" class="head">Shared modules · lib/</text>
<rect x="408" y="438" width="225" height="48" rx="7" class="box"/><text x="422" y="468" class="node">pricing.js</text>
<rect x="650" y="438" width="238" height="48" rx="7" class="box"/><text x="664" y="468" class="node">tax.js</text>
<rect x="408" y="500" width="225" height="48" rx="7" class="box"/><text x="422" y="530" class="node">coupons.js</text>
<rect x="650" y="500" width="238" height="48" rx="7" class="box"/><text x="664" y="530" class="node">inventory.js</text>
<rect x="408" y="562" width="225" height="48" rx="7" class="box"/><text x="422" y="592" class="node">orders.js</text>
<rect x="650" y="562" width="238" height="48" rx="7" class="box"/><text x="664" y="592" class="node">ledger.js</text>
<rect x="408" y="624" width="225" height="48" rx="7" class="box"/><text x="422" y="654" class="node">store.js</text>
<rect x="650" y="624" width="238" height="48" rx="7" class="box"/><text x="664" y="654" class="node">dates.js · reports.js</text>
<rect x="408" y="686" width="480" height="40" rx="7" class="ticket"/><text x="422" y="712" class="node">invoice.js · computeInvoiceFigures() → render()</text>

<!-- Configuration and invoice -->
<rect x="934" y="394" width="236" height="118" rx="12" class="group"/>
<text x="952" y="420" class="head">Configuration</text>
<rect x="952" y="438" width="200" height="56" rx="7" class="box"/><text x="966" y="462" class="node">config.js</text><text x="966" y="482" class="small">shop · GST slabs · coupons</text>
<rect x="934" y="532" width="236" height="112" rx="12" class="ticket"/>
<text x="952" y="559" class="node">Printable invoice</text><text x="952" y="582" class="small">server.js: GET</text><text x="952" y="602" class="small">/orders/:id/invoice</text><text x="952" y="624" class="small">HTML rendered from saved order</text>
<path d="M888 706 H918 V590 H934" class="line"/>
<path d="M1025 532 V510" class="line"/>

<!-- Legend -->
<rect x="934" y="666" width="236" height="76" rx="10" class="group"/>
<text x="950" y="690" class="head">Legend</text>
<rect x="950" y="701" width="18" height="16" rx="3" class="ticket"/><text x="977" y="714" class="small">Ticket focus: invoice.js</text>
<line x1="950" y1="729" x2="975" y2="729" class="flow"/><text x="985" y="734" class="small">Numbered order flow</text>
</svg>
